name: Build Quest APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: |
          set -euxo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Bundle offline Russian Vosk model
        run: |
          set -euxo pipefail
          curl --fail --location --retry 3 -o /tmp/vosk-model.zip https://alphacephei.com/vosk/models/vosk-model-small-ru-0.22.zip
          mkdir -p /tmp/vosk-unpacked app/src/main/assets/model-ru
          unzip -q /tmp/vosk-model.zip -d /tmp/vosk-unpacked
          cp -a /tmp/vosk-unpacked/vosk-model-small-ru-0.22/. app/src/main/assets/model-ru/
          test -f app/src/main/assets/model-ru/am/final.mdl
          # Vosk StorageService requires a uuid file in the asset model root.
          # Its contents act as the unpacked-model version marker.
          printf "vosk-small-ru-0.22-questai-v1\\n" > app/src/main/assets/model-ru/uuid
          test -s app/src/main/assets/model-ru/uuid
      - name: Fetch llama.cpp native inference engine
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git app/src/main/cpp/llama.cpp
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: QuestAI-Local-LLM-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
